name: EveryGSM prod CD workflow

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  CD:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Make YML Files
        run: |
          touch ./src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_APPLICATION_YAML }}" > ./src/main/resources/application-prod.yml
        shell: bash

      - name: Build with Gradle
        run: ./gradlew build -x test --parallel --build-cache

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Make ENV File
        run: |
          {
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}"
            echo "DATAGSM_OPENAPI_KEY=${{ secrets.DATAGSM_OPENAPI_KEY }}"
            echo "DATAGSM_CLIENT_ID=${{ secrets.DATAGSM_CLIENT_ID }}"
            echo "DATAGSM_CLIENT_SECRET=${{ secrets.DATAGSM_CLIENT_SECRET }}"
            echo "DATAGSM_REDIRECT_URIS=${{ secrets.DATAGSM_REDIRECT_URIS }}"
            echo "DATAGSM_API_URL=${{ secrets.DATAGSM_API_URL }}"
          } > .env
        shell: bash

      - name: Make ZIP File
        run: zip -r ./$GITHUB_SHA.zip . -x "*.git*" -x "*.gradle*" -x "build/tmp/*"
        shell: bash

      - name: Upload to S3
        run: aws s3 cp --region ${{ secrets.AWS_REGION }} ./$GITHUB_SHA.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/prod/$GITHUB_SHA.zip

      - name: Code Deploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.AWS_S3_BUCKET_NAME }},bundleType=zip,key=prod/$GITHUB_SHA.zip \
            --region ${{ secrets.AWS_REGION }}

      - name: CD Success Notification
        uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0x4CAF50

      - name: CD Failure Notification
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFF4C4C

      - name: CD Cancelled Notification
        uses: sarisia/actions-status-discord@v1
        if: cancelled()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFFC107
