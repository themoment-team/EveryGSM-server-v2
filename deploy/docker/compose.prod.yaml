services:
  app:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - '8080:8080'
    restart: unless-stopped
    mem_limit: 480m
    memswap_limit: 480m
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: 'mysql:8.0.36'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: everygsm
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 280m
    memswap_limit: 280m

volumes:
  mysql_data: