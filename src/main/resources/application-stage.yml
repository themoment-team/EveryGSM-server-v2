spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/everygsm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:3001"

jwt:
  secret: ${JWT_SECRET}

sdk:
  exception:
    use-english-message: false

discord:
  webhook:
    url: ${DISCORD_ERROR_WEBHOOK_URL}
