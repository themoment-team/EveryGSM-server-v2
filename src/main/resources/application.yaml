spring:
  application:
    name: everygsm.server.v2
  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  cloud:
    datagsm:
      openapi:
        sync-cron: "0 0 3 * * *"
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false
    discord:
      webhook:
        url: ${DISCORD_ERROR_WEBHOOK_URL:http://localhost}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  shutdown: graceful
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  expiration: 60

datagsm:
  api:
    url: ${DATAGSM_API_URL:http://localhost}

rate-limit:
  max-requests: 100
  window-seconds: 60