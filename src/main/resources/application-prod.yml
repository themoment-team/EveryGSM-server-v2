spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/everygsm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  security:
    cors:
      allowed-origins:
        - "https://everygsm.kr"

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
      stack:
        auto: false

springdoc:
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET_KEY}