spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/everygsm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
  security:
    cors:
      allowed-origins:
        - "https://everygsm.kr"
jwt:
  secret: ${JWT_SECRET}

sdk:
  swagger:
    enabled: false
  exception:
    use-english-message: false

springdoc:
  api-docs:
    enabled: false
