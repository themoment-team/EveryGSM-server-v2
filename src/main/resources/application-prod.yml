spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/everygsm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
  security:
    cors:
      allowed-origins:
        - "https://everygsm.kr"

jwt:
  secret: ${JWT_SECRET}

sdk:
  swagger:
    enabled: false
  exception:
    use-english-message: false

datagsm:
  api:
    url: ${DATAGSM_API_URL}
    key: ${DATAGSM_OPENAPI_KEY}